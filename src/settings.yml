---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.4.0
serverless_language: ''
refresh_interval_floor: '5'
polling_url: https://meteocerdanyola.com/2026/api/open-data.php?v=1&slug={{ station }}&dataset=recent&hours=24&variables=temperature%2Chumidity%2Cwind%2Cpressure%2Crain&format=json
polling_headers: ''
polling_body: ''
id: 495390
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: station
  field_type: select
  name: Estación meteorológica
  description: Estación de meteocerdanyola.com de la que se muestran los datos.
  options:
  - Cerdanyola Ateneu: cerdanyola_ateneu
  - Cerdanyola Centre: cerdanyola_centre
  - Cerdanyola Montflorit: cerdanyola_montflorit
  default: cerdanyola_ateneu
- keyname: language
  field_type: select
  name: Idioma
  description: Idioma de los textos de la pantalla.
  options:
  - Català: ca
  - Castellano: es
  - English: en
  default: es
- keyname: about
  field_type: author_bio
  name: About This Plugin
  category: environment,life
  description: Live weather from the meteocerdanyola.com stations in Cerdanyola del Vallès (Barcelona). Shows the current temperature, wind, pressure, rain and humidity, a 24 h temperature chart with hourly rain bars, and the high and low. Three stations and three languages (Catalan, Spanish, English). Unofficial personal project; data from meteocerdanyola.com.
  github_url: https://github.com/mikim83/meteocerdanyola-trmnl-dashboard
  learn_more_url: https://meteocerdanyola.com
name: meteocerdanyola.com
description: meteocerdanyola.com dashboard
refresh_interval: 15
